<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arquitetura · AIOps em Kubernetes</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; }
  text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; text-rendering: geometricPrecision; }
  .mono { font-family: 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"
     aria-label="Arquitetura de AIOps em Kubernetes: cargas com falha, métricas, alerta, gateway, coleta de evidências, agente LLM ou regras, e saídas">
</svg>
<script>
// ============ utilidades ============
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('s');
function E(tag, attrs = {}, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => {
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
};

// ============ paleta (estilo diagrama de arquitetura) ============
const C = {
  ink: '#232f3e', sub: '#5f6b7a', off: '#b8c0ca', offText: '#9aa4b0', offSub: '#b9c1cb', white: '#ffffff',
  orange: '#ed7100', pink: '#e7157b', purple: '#8c4fff', teal: '#01a88d', green: '#7aa116',
  red: '#dd344c', gray: '#7d8998', dot: '#ff9900',
};
const T = 8.5;           // duração do loop (s)
const FADE0 = 8.0;       // início do apagar para fechar o loop
const fade = t => 1 - smooth(FADE0, T, t);
const lit = (t, at, noFade) => smooth(at, at + 0.3, t) * (noFade ? 1 : fade(t));
const updaters = [];

// ============ glifos (64x64, traço branco) ============
const GLYPHS = {
  cube:   [{ d: 'M32 11 L51 22 V43 L32 54 L13 43 V22 Z M13 22 L32 33 L51 22 M32 33 V54' }],
  chart:  [{ d: 'M13 13 V51 H52 M20 41 L29 28 L38 36 L51 17' }],
  bell:   [{ d: 'M32 11 C22 11 20 21 20 30 C20 38 13 40 13 45 H51 C51 40 44 38 44 30 C44 21 42 11 32 11 Z M26 50 C27 55 37 55 38 50' }],
  funnel: [{ d: 'M13 15 H51 L38 32 V50 L26 43 V32 Z' }],
  search: [{ d: 'M38 38 L52 52' }, { c: [28, 28, 14] }],
  robot:  [{ d: 'M32 23 V13 M9 33 V41 M55 33 V41' }, { r: [16, 23, 32, 26, 6] }, { f: [32, 11, 3] }, { f: [24, 36, 3.4] }, { f: [40, 36, 3.4] }],
  rules:  [{ d: 'M24 19 H52 M24 32 H52 M24 45 H52' }, { f: [15, 19, 3] }, { f: [15, 32, 3] }, { f: [15, 45, 3] }],
  doc:    [{ d: 'M17 9 H38 L49 20 V55 H17 Z M38 9 V20 H49 M24 31 H42 M24 39 H42 M24 47 H35' }],
  db:     [{ d: 'M14 17 V47 C14 56 50 56 50 47 V17 M14 17 C14 26 50 26 50 17 C50 8 14 8 14 17 M14 32 C14 41 50 41 50 32' }],
  api:    [{ d: 'M24 18 L11 32 L24 46 M40 18 L53 32 L40 46 M35 13 L29 51' }],
  shield: [{ d: 'M32 9 L51 16 V32 C51 44 41 52 32 55 C23 52 13 44 13 32 V16 Z M23 32 L29 38 L41 25' }],
  hex:    [{ d: 'M32 8 L53 20 V44 L32 56 L11 44 V20 Z M32 22 L43 28 V40 L32 46 L21 40 V28 Z' }],
};
function glyph(parent, name, cx, cy, size, stroke = C.white) {
  const g = E('g', { transform: `translate(${cx - size / 2},${cy - size / 2}) scale(${size / 64})`,
    fill: 'none', stroke, 'stroke-width': 3.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
  GLYPHS[name].forEach(p => {
    if (p.d) E('path', { d: p.d }, g);
    if (p.c) E('circle', { cx: p.c[0], cy: p.c[1], r: p.c[2] }, g);
    if (p.r) E('rect', { x: p.r[0], y: p.r[1], width: p.r[2], height: p.r[3], rx: p.r[4] }, g);
    if (p.f) E('circle', { cx: p.f[0], cy: p.f[1], r: p.f[2], fill: stroke, stroke: 'none' }, g);
  });
  return g;
}

// ============ moldura e cabeçalho ============
E('rect', { width: 1200, height: 675, fill: C.white });
E('rect', { x: 0.5, y: 0.5, width: 1199, height: 674, fill: 'none', stroke: '#d0d7de' });
E('text', { x: 40, y: 54, 'font-size': 32, 'font-weight': 700, fill: C.ink }, svg, 'AIOps em Kubernetes');
E('text', { x: 40, y: 82, 'font-size': 16, fill: C.sub }, svg, 'Agente de IA que diagnostica incidentes do cluster · somente leitura');
E('rect', { x: 786, y: 30, width: 374, height: 36, rx: 4, fill: C.white, stroke: C.ink, 'stroke-width': 1.5 });
E('text', { x: 973, y: 53, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, 'letter-spacing': 0.8,
  fill: C.ink }, svg, 'LABORATÓRIO LOCAL · PADRÕES DE PRODUÇÃO');

// ============ grupos ============
function group({ x, y, w, h, color, label, icon, dashed = true, labelSize = 14, iconSize = 28 }) {
  E('rect', { x, y, width: w, height: h, rx: 4, fill: C.white, stroke: color, 'stroke-width': dashed ? 1.6 : 2.2,
    'stroke-dasharray': dashed ? '7 5' : '' });
  E('rect', { x: x + 8, y: y + 8, width: iconSize, height: iconSize, rx: 3, fill: color });
  glyph(svg, icon, x + 8 + iconSize / 2, y + 8 + iconSize / 2, iconSize * 0.78);
  E('text', { x: x + 8 + iconSize + 9, y: y + 8 + iconSize / 2 + 5, 'font-size': labelSize, 'font-weight': 700,
    fill: C.ink }, svg, label);
}
group({ x: 20, y: 100, w: 1160, h: 405, color: C.ink, label: 'Cluster Kubernetes (Kind) · Docker local', icon: 'hex',
  dashed: false, labelSize: 16, iconSize: 32 });
group({ x: 40, y: 140, w: 210, h: 300, color: C.red, label: 'ns demo · chaos', icon: 'cube' });
group({ x: 270, y: 140, w: 240, h: 300, color: C.pink, label: 'ns monitoring', icon: 'chart' });
group({ x: 535, y: 140, w: 420, h: 300, color: C.purple, label: 'ns aiops · agente', icon: 'robot' });
group({ x: 980, y: 140, w: 180, h: 300, color: C.green, label: 'Saídas', icon: 'doc' });

// ============ tiles (ícone + rótulo) ============
function tile({ cx, cy, size = 64, color, icon, at, name, subs = [], pos = 'below', dashed = false, badge, noFade = false,
  mono = false, nameSize = 15 }) {
  const x = cx - size / 2, y = cy - size / 2;
  const rect = E('rect', { x, y, width: size, height: size, rx: 6, fill: dashed ? C.white : color,
    stroke: dashed ? color : 'none', 'stroke-width': 2, 'stroke-dasharray': dashed ? '5 4' : '' });
  const g = glyph(svg, icon, cx, cy, size * 0.74, dashed ? color : C.white);
  let nx, ny, anchor = 'middle';
  if (pos === 'below') { nx = cx; ny = y + size + 20; }
  else if (pos === 'right') { nx = x + size + 10; ny = cy - (subs.length ? 2 : -5); anchor = 'start'; }
  else { nx = x - 10; ny = cy - (subs.length ? 2 : -5); anchor = 'end'; }
  const nameEl = E('text', { x: nx, y: ny, 'text-anchor': anchor, 'font-size': nameSize, 'font-weight': 700,
    class: mono ? 'mono' : '' }, svg, name);
  const subEls = subs.map((s, i) => E('text', { x: nx, y: ny + 17 + i * 16, 'text-anchor': anchor, 'font-size': 12.5 }, svg, s));
  let b = null;
  if (badge) {
    b = E('circle', { cx: x, cy: y, r: 11.5 });
    E('text', { x, y: y + 4.5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800, fill: C.white }, svg, String(badge));
  }
  updaters.push(t => {
    const k = lit(t, at, noFade);
    if (!dashed) rect.setAttribute('fill', mix(color, '#ffffff', 0.66 * (1 - k)));
    nameEl.setAttribute('fill', mix(C.offText, C.ink, k));
    subEls.forEach(s => s.setAttribute('fill', mix(C.offSub, C.sub, k)));
    if (b) b.setAttribute('fill', mix(C.off, C.ink, k));
  });
}

// Z1 — cargas com falha (origem; sempre acesas)
[
  { cy: 215, name: 'payments-api', sub: 'OOMKilled · exit 137', badge: 1 },
  { cy: 295, name: 'orders-worker', sub: 'CrashLoopBackOff' },
  { cy: 375, name: 'search-indexer', sub: 'throttling · Running' },
].forEach((p, i) => {
  tile({ cx: 80, cy: p.cy, size: 52, color: C.orange, icon: 'cube', at: -10, noFade: true, name: p.name, subs: [p.sub],
    pos: 'right', mono: true, nameSize: 13.5, badge: p.badge });
  const al = E('g', {});
  E('circle', { cx: 106, cy: p.cy - 26, r: 8.5, fill: C.red }, al);
  E('text', { x: 106, y: p.cy - 21.5, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 800, fill: C.white }, al, '!');
  updaters.push(t => al.setAttribute('opacity', (0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 5 + i * 1.7))).toFixed(2)));
});

// Z2 — monitoramento
tile({ cx: 340, cy: 275, color: C.pink, icon: 'chart', at: 1.3, name: 'Prometheus', subs: ['métricas + regras'], badge: 2 });
tile({ cx: 445, cy: 275, color: C.pink, icon: 'bell', at: 1.8, name: 'Alertmanager', subs: ['agrupa · webhook'], badge: 3 });
const firing = E('g', {});
E('rect', { x: 417, y: 216, width: 56, height: 18, rx: 3, fill: C.red }, firing);
E('text', { x: 445, y: 229, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 800, 'letter-spacing': 0.8, fill: C.white }, firing, 'FIRING');
updaters.push(t => firing.setAttribute('opacity', (smooth(1.8, 2.0, t) * fade(t)).toFixed(2)));

// Z3 — agente
tile({ cx: 600, cy: 275, color: C.purple, icon: 'funnel', at: 2.5, name: 'Gateway', subs: ['FastAPI · dedupe'], badge: 4 });
tile({ cx: 725, cy: 275, color: C.purple, icon: 'search', at: 3.0, name: 'Evidências',
  subs: ['logs · eventos · métricas', 'runbooks · memória'], badge: 5 });
tile({ cx: 850, cy: 275, color: C.teal, icon: 'robot', at: 4.5, name: 'Agente LLM', subs: ['JSON com schema'], badge: 6 });
tile({ cx: 850, cy: 190, size: 48, color: C.gray, icon: 'rules', at: -10, noFade: true, name: 'Regras', subs: ['fallback'], pos: 'left',
  dashed: true, nameSize: 14 });
E('text', { x: 860, y: 233, 'font-size': 11.5, 'font-style': 'italic', fill: C.sub }, svg, 'se falhar');

// anel de processamento do agente
const ring = E('circle', { cx: 850, cy: 275, r: 36, fill: 'none', stroke: C.teal, 'stroke-width': 2.5, opacity: 0 });
updaters.push(t => {
  const p = clamp((t - 4.5) / 0.6), ph = (p * 2) % 1;
  ring.setAttribute('r', (36 + 14 * ph).toFixed(1));
  ring.setAttribute('opacity', (p > 0 && p < 1 ? 0.7 * (1 - ph) : 0).toFixed(2));
});

// Z4 — saídas
[
  { cy: 215, icon: 'doc', color: C.green, name: 'Relatório', sub: '.md · evidências', at: 5.7, badge: 7 },
  { cy: 275, icon: 'db', color: C.green, name: 'Memória', sub: 'SQLite · PVC', at: 5.8 },
  { cy: 335, icon: 'api', color: C.purple, name: 'API REST', sub: '/incidents', at: 5.9 },
].forEach(o => tile({ cx: 1014, cy: o.cy, size: 48, color: o.color, icon: o.icon, at: o.at, name: o.name, subs: [o.sub],
  pos: 'right', nameSize: 14, badge: o.badge }));

// ============ fluxos ============
function geometry(pts) {
  const seg = []; let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    seg.push(l); total += l;
  }
  return { seg, total };
}
function pointAt(pts, g, d) {
  let acc = 0;
  for (let i = 0; i < g.seg.length; i++) {
    if (d <= acc + g.seg[i] || i === g.seg.length - 1) {
      const u = g.seg[i] ? (d - acc) / g.seg[i] : 0;
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * u, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * u];
    }
    acc += g.seg[i];
  }
  return pts[pts.length - 1];
}
function arrowhead(tip, from, parent, color = C.off) {
  const dx = tip[0] - from[0], dy = tip[1] - from[1], l = Math.hypot(dx, dy) || 1;
  const ux = dx / l, uy = dy / l, px = -uy, py = ux;
  const bx = tip[0] - ux * 10, by = tip[1] - uy * 10;
  return E('polygon', { points: `${tip[0]},${tip[1]} ${bx + px * 5},${by + py * 5} ${bx - px * 5},${by - py * 5}`, fill: color }, parent);
}
function flow(pts, { t0, t1, head = true }) {
  const d = 'M' + pts.map(p => p.join(',')).join(' L');
  const g = geometry(pts);
  E('path', { d, fill: 'none', stroke: C.off, 'stroke-width': 2, 'stroke-linejoin': 'round' });
  const on = E('path', { d, fill: 'none', stroke: C.ink, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-dasharray': `0 ${g.total}` });
  const ah = head ? arrowhead(pts[pts.length - 1], pts[pts.length - 2], svg) : null;
  const halo = E('circle', { r: 11, fill: C.dot, opacity: 0 });
  const dot = E('circle', { r: 5.5, fill: C.dot, stroke: C.white, 'stroke-width': 1.5, opacity: 0 });
  updaters.push(t => {
    const p = smooth(t0, t1, t), f = fade(t);
    on.setAttribute('stroke-dasharray', `${(g.total * p).toFixed(1)} ${g.total}`);
    on.setAttribute('opacity', f.toFixed(2));
    if (ah) ah.setAttribute('fill', p >= 0.995 ? mix(C.off, C.ink, f) : C.off);
    const moving = t > t0 && t < t1;
    const [x, y] = pointAt(pts, g, g.total * p);
    [halo, dot].forEach(c => { c.setAttribute('cx', x); c.setAttribute('cy', y); });
    halo.setAttribute('opacity', moving ? 0.3 : 0);
    dot.setAttribute('opacity', moving ? 1 : 0);
  });
}
flow([[250, 275], [308, 275]], { t0: 0.8, t1: 1.3 });                                // falha -> Prometheus
flow([[372, 275], [413, 275]], { t0: 1.4, t1: 1.8 });                                // Prometheus -> Alertmanager
flow([[477, 275], [568, 275]], { t0: 1.9, t1: 2.5 });                                // Alertmanager -> Gateway
flow([[632, 275], [693, 275]], { t0: 2.6, t1: 3.0 });                                // Gateway -> Evidências
flow([[757, 275], [818, 275]], { t0: 4.0, t1: 4.5 });                                // Evidências -> Agente
flow([[882, 275], [968, 275], [990, 275]], { t0: 5.1, t1: 5.6 });                    // Agente -> Memória
flow([[882, 275], [968, 275], [968, 215], [990, 215]], { t0: 5.1, t1: 5.7 });        // Agente -> Relatório
flow([[882, 275], [968, 275], [968, 335], [990, 335]], { t0: 5.1, t1: 5.8 });        // Agente -> API
// agente -> regras (tracejado) e regras -> saídas
E('path', { d: 'M850,243 L850,216', stroke: C.off, 'stroke-width': 2, 'stroke-dasharray': '4 4', fill: 'none' });
arrowhead([850, 216], [850, 243], svg);
E('path', { d: 'M874,190 L968,190 L968,215', stroke: C.off, 'stroke-width': 2, 'stroke-dasharray': '4 4', fill: 'none' });

// ============ leitura ao cluster (tracejado) ============
(function () {
  const pts = [[725, 368], [725, 475], [145, 475], [145, 440]];
  const branch = [[340, 475], [340, 440]];
  const d = 'M' + pts.map(p => p.join(',')).join(' L'), bd = 'M' + branch.map(p => p.join(',')).join(' L');
  const g = geometry(pts);
  const base = { fill: 'none', 'stroke-width': 2, 'stroke-dasharray': '7 5' };
  E('path', { d, stroke: C.off, ...base }); E('path', { d: bd, stroke: C.off, ...base });
  const on1 = E('path', { d, stroke: C.teal, ...base, opacity: 0 });
  const on2 = E('path', { d: bd, stroke: C.teal, ...base, opacity: 0 });
  const heads = [arrowhead(pts[pts.length - 1], pts[pts.length - 2], svg), arrowhead(branch[1], branch[0], svg)];
  E('text', { x: 360, y: 466, 'font-size': 13, 'font-style': 'italic', fill: C.sub }, svg,
    'consulta somente leitura · RBAC · get / logs / events');
  const halo = E('circle', { r: 11, fill: C.teal, opacity: 0 });
  const dot = E('circle', { r: 5.5, fill: C.teal, stroke: C.white, 'stroke-width': 1.5, opacity: 0 });
  updaters.push(t => {
    const k = smooth(3.1, 3.4, t) * fade(t);
    [on1, on2].forEach(p => { p.setAttribute('opacity', k.toFixed(2)); p.setAttribute('stroke-dashoffset', (-t * 30).toFixed(1)); });
    heads.forEach(h => h.setAttribute('fill', mix(C.off, C.teal, k)));
    const run = clamp((t - 3.1) / 0.9), moving = run > 0 && run < 1;
    const [x, y] = pointAt(pts, g, g.total * (1 - run));
    [halo, dot].forEach(c => { c.setAttribute('cx', x); c.setAttribute('cy', y); });
    halo.setAttribute('opacity', moving ? 0.3 : 0);
    dot.setAttribute('opacity', moving ? 1 : 0);
  });
})();

// ============ guardrails ============
group({ x: 20, y: 520, w: 1160, h: 125, color: C.teal, label: 'Guardrails · aplicados em todo o fluxo', icon: 'shield',
  labelSize: 14 });
['RBAC somente leitura', 'Redação de segredos', 'Logs não confiáveis', 'Saída com schema', 'Teto de tokens', 'Fallback por regras']
  .forEach((label, i) => {
    const x = 44 + i * 190, y = 601, at = 6.1 + i * 0.12;
    const ring2 = E('circle', { cx: x + 10, cy: y, r: 10, fill: C.white, stroke: C.off, 'stroke-width': 2 });
    const chk = E('path', { d: `M${x + 5},${y} l4,4 l7,-8`, fill: 'none', stroke: C.off, 'stroke-width': 2.4,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const tx = E('text', { x: x + 29, y: y + 5, 'font-size': 14.5, 'font-weight': 600 }, svg, label);
    updaters.push(t => {
      const k = lit(t, at, false);
      ring2.setAttribute('stroke', mix(C.off, C.teal, k));
      chk.setAttribute('stroke', mix(C.off, C.teal, k));
      tx.setAttribute('fill', mix(C.offText, C.ink, k));
    });
  });

window.TOTAL = T;
window.renderAt = t => updaters.forEach(u => u(t));
window.renderAt(0);
</script>
</body>
</html>
